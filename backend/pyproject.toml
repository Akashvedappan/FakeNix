[project]
name = "fakenix-backend"
version = "2.0.0"
description = "FAKENIX 2.0 — Flask API for deepfake detection and digital forensics"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    # Authentication
    "flask-jwt-extended>=4.5.0",
    "werkzeug>=3.0.0",
    # Database drivers
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Image / video processing
    "opencv-python-headless",
    "pillow",
    # Metadata extraction
    "pymediainfo>=6.0.0",
    # PDF report generation
    "reportlab>=4.0.0",
    # HTTP requests (URL analysis)
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    # AI analysis (vision LLM)
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
# This is an application, not a library: install dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
